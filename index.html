<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Convict Conditioning</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#14161a; --mute:#6b7280; --line:#e3e5ea;
  --accent:#ff8c1a; --on-accent:#14161a; --ok:#16a34a; --cal-ok:#22c55e; --cal-miss:#ef4444; --fill:rgba(255,140,26,.38); --panel:#14161a; --panel-ink:#fff; --panel-2:#23262d;
  --t1:#f59e0b; --t2:#3b82f6; --t3:#16a34a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d0e10; --card:#1a1c20; --ink:#f2f3f5; --mute:#9aa0aa; --line:#2a2d34; --panel:#1f2228; --panel-2:#2c3037; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.top{flex:1;min-height:0;overflow:auto;padding:20px 16px 16px}
.bottom{flex:none;padding:12px 16px 16px}
h1{font-size:28px;margin:0 0 2px}
h3{margin:4px 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.card{display:flex;align-items:center;background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;gap:12px}
.card .info{flex:1;min-width:0}
.card .name{font-weight:700;font-size:18px}
.card .meta{color:var(--mute);font-size:14px}
.rest{background:var(--card);border-radius:18px;padding:20px;margin-bottom:12px}
.rest b{font-size:20px;display:block;margin-bottom:4px}
.play{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:24px;flex:none}
.big{min-height:64px;border-radius:18px;padding:0 24px;font-weight:700;font-size:18px;background:var(--accent);color:var(--on-accent)}
.ghost{background:var(--card);color:var(--ink)}
.row-end{display:flex;justify-content:flex-end;gap:10px}
.tiers{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tier{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--mute)}
.tier.met{color:#fff} .tier.met.k{background:var(--t1)} .tier.met.m{background:var(--t2)} .tier.met.h{background:var(--t3)}
nav{flex:none;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
nav button{flex:1;height:54px;border-radius:999px;border:1.5px solid var(--accent);color:var(--ink);display:grid;place-items:center}
nav button svg{width:28px;height:28px}
nav button.on{background:var(--accent);border:1px solid #000;color:#000}
nav.hide{display:none}
/* active */
.mvname{font-size:14px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.exname{font-size:26px;font-weight:800;margin:2px 0 4px}
.goal{color:var(--mute);font-size:14px;margin-bottom:12px}
.queue{list-style:none;margin:0 0 10px;padding:0}
.queue li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border-radius:12px;margin-bottom:8px;font-size:17px;border:2px solid transparent}
.queue li.cur{border-color:var(--accent)}
.queue li.done{opacity:.6}
.queue li span{color:var(--mute);font-size:15px}
.queue li.done span{color:var(--ink)}
.hint{color:var(--mute);font-size:14px;margin:6px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.panel{background:var(--panel);color:var(--panel-ink);border-radius:28px 28px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.stepper{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:18px;padding:6px;margin-bottom:14px}
.stepper label{width:72px;padding-left:10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9aa0aa}
.stepper output{flex:1;text-align:center;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper button{width:72px;height:64px;border-radius:14px;background:#3a3f48;font-size:30px;font-weight:700;color:#fff}
.stepper button.plus{background:#4a505c}
.actions{display:flex;align-items:center;gap:10px}
.end{height:56px;padding:0 16px;border-radius:14px;background:var(--panel-2);color:#ff8a8a;font-weight:700}
.minor{height:56px;padding:0 14px;border-radius:14px;background:var(--panel-2);color:#fff;font-weight:600}
.log{flex:1;height:72px;border-radius:22px;background:var(--accent);color:var(--on-accent);font-size:19px;font-weight:800;padding:0 12px}
.log.warm{background:#4a505c;color:#fff}
.log:active,.play:active,.big:active{transform:scale(.97)}
.flash{animation:flash .35s}
@keyframes flash{50%{background:var(--ok)}}
/* progress */
.mvsw{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:6px}
.mvsw button{width:64px;height:64px;border-radius:14px;background:var(--bg);font-size:28px;font-weight:700;flex:none}
.mvsw-c{flex:1;min-width:0;text-align:center}
.mvsw-c b{display:block;font-size:20px}
.mvsw-c small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{background:var(--card);border-radius:18px;padding:12px;margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block}
.empty{color:var(--mute);text-align:center;padding:30px 0}
/* program */
.opt-card{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:8px;border:2px solid transparent}
.opt-card.on{border-color:var(--accent)}
.opt-card b{display:block;font-size:17px}
.opt-card small{color:var(--mute)}
.srow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px}
.srow .sinfo{flex:1;min-width:0}
.srow .sinfo small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow button{width:48px;height:48px;border-radius:12px;background:var(--line);font-size:22px;font-weight:700}
.srow .snum{width:28px;text-align:center;font-weight:800;font-size:18px}
.section{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.small{height:48px;padding:0 16px;border-radius:12px;background:var(--card);font-weight:600}
/* body */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:20px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
/* home */
#s-home .top{display:flex;flex-direction:column;overflow:hidden;padding-bottom:4px}
#s-home .bottom{padding-top:8px}
.cal{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:18px;padding:10px 10px 8px}
.calhead{flex:none;display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
.calhead b{font-size:17px}
.calhead button{width:36px;height:36px;border-radius:12px;background:var(--bg);font-size:20px}
.calgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:3px 2px;text-align:center;align-items:center;justify-items:center}
.calgrid .wd{font-size:12px;color:var(--mute);font-weight:600;padding-bottom:2px}
.cd{height:100%;max-height:44px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:600}
.cd.plan{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.done{background:var(--cal-ok);color:#fff}
.cd.miss{background:var(--cal-miss);color:#fff}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{flex:none;display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.wbar{display:flex;align-items:center;height:52px;background:var(--card);border-radius:16px;padding:0 6px 0 16px;border:1.5px solid var(--line)}
.wbar:focus-within{border-color:var(--accent)}
.wbar.bad{border-color:#e11d48;animation:shake .3s}
.wbar .wl{font-weight:700;white-space:nowrap}
.wbar input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;padding:0}
.wbar input::placeholder{color:var(--mute);opacity:.45}
.wbar .wu{margin:0 8px 0 6px;font-weight:700;color:var(--mute)}
.wbar .wok{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:20px;font-weight:800;visibility:hidden}
.wbar.has .wok{visibility:visible}
.bars{background:var(--card);border-radius:16px;padding:4px 10px}
.bar{display:flex;align-items:center;gap:10px;width:100%;height:34px;text-align:left}
.bar > span:first-child{width:84px;flex:none;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .segs{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.bar .segs i{height:14px;border-radius:4px;border:1.5px solid var(--accent)}
.bar .segs i.on{background:var(--accent)}
.bar small{width:34px;flex:none;text-align:right;font-size:13px;color:var(--mute);font-weight:600}
@media (max-height:720px){ .bar{height:28px} .bar .segs i{height:12px} #s-home .top{padding-top:12px} .calhead button{width:32px;height:32px} }
@media (max-height:600px){ .bar{height:24px} .bar .segs i{height:10px} .legend{display:none} }
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet button.opt{display:block;width:100%;text-align:left;min-height:56px;padding:0 14px;border-radius:14px;font-size:17px}
.sheet button.opt:active{background:var(--line)}
.sheet button.opt.primary{background:var(--accent);color:var(--on-accent);font-weight:700;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <section class="screen on" id="s-home">
    <div class="top">
      <div class="cal" id="cal"></div>
    </div>
    <div class="bottom">
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <section class="screen" id="s-today">
    <div class="top">
      <h1 id="todayTitle"></h1>
      <p class="sub" id="todaySub"></p>
      <div id="todayList"></div>
    </div>
    <div class="bottom row-end" id="todayBtns"></div>
  </section>

  <section class="screen" id="s-active">
    <div class="top" id="activeTop"></div>
    <div class="panel">
      <div class="stepper"><label id="unitLbl"></label><button data-s="-" aria-label="−">−</button><output id="valOut"></output><button class="plus" data-s="+" aria-label="+">+</button></div>
      <div class="actions">
        <button class="end" id="endBtn"></button>
        <button class="minor" id="minorBtn"></button>
        <button class="log" id="logBtn"></button>
      </div>
    </div>
  </section>

  <section class="screen" id="s-progress">
    <div class="top">
      <div class="chart" id="pgChart"></div>
    </div>
    <div class="bottom"><div class="mvsw"><button id="pgPrev" aria-label="‹">‹</button><div class="mvsw-c"><b id="pgName"></b><small id="pgStep"></small></div><button id="pgNext" aria-label="›">›</button></div></div>
  </section>

  <section class="screen" id="s-program">
    <div class="top" id="programTop"></div>
    <div class="bottom"><label class="wbar" id="kgField"><span class="wl" id="wLabel"></span><input id="bwIn" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="kg"><span class="wu">kg</span><button class="wok" id="bwSave" type="button" aria-label="Save">✓</button></label></div>
  </section>

  <nav id="nav">
    <button data-t="home" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.5v9.5h5.5v-6h3v6H19V11h2.5z"/></svg></button>
    <button data-t="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,17 8,10.5 12.5,14.5 21.5,6.5"/><circle cx="8" cy="10.5" r="1.4" fill="currentColor"/><circle cx="12.5" cy="14.5" r="1.4" fill="currentColor"/><circle cx="21.5" cy="6.5" r="1.4" fill="currentColor"/></svg></button>
    <button data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="4.5" cy="8.5" r="2.3" fill="currentColor" stroke="none"/><path d="M7 10.5 22 17.5M8.5 11.2V18"/></svg></button>
    <button data-t="program"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.3"/><path d="M3.5 21.5c0-4.9 3.8-8.3 8.5-8.3s8.5 3.4 8.5 8.3z"/></svg></button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
"use strict";
/* ============ Data: the six movements, ten steps each ============
   Goals per step: [sets, reps] for Kezdő / Középhaladó / Haladó. s = seconds, e = each side. */
const MV = ["push","squat","pull","leg","bridge","hspu"];
const STEPS = {
 push: [
  ["Fekvőtámasz falnál","Wall push-up","1x10 2x25 3x50"],
  ["Fekvőtámasz előredőlve","Incline push-up","1x10 2x20 3x40"],
  ["Fekvőtámasz térdelve","Kneeling push-up","1x10 2x15 3x30"],
  ["Fél fekvőtámasz","Half push-up","1x8 2x12 2x25"],
  ["Teljes fekvőtámasz","Full push-up","1x5 2x10 2x20"],
  ["Fekvőtámasz szűk kéztartással","Close push-up","1x5 2x10 2x20"],
  ["Felemás fekvőtámasz","Uneven push-up","1x5 2x10 2x20","e"],
  ["Fél egykezes fekvőtámasz","½ one-arm push-up","1x5 2x10 2x20","e"],
  ["Emelőkaros fekvőtámasz","Lever push-up","1x5 2x10 2x20","e"],
  ["Egykezes fekvőtámasz","One-arm push-up","1x5 2x10 1x100","e"]],
 squat: [
  ["Guggolás gyertyaállásban","Shoulderstand squat","1x10 2x25 3x50"],
  ["Bicska guggolás","Jackknife squat","1x10 2x20 3x40"],
  ["Guggolás támasszal","Supported squat","1x10 2x15 3x30"],
  ["Fél guggolás","Half squat","1x8 2x35 2x50"],
  ["Teljes guggolás","Full squat","1x5 2x10 2x30"],
  ["Guggolás zárt lábbal","Close squat","1x5 2x10 2x20"],
  ["Felemás guggolás labdával","Uneven squat","1x5 2x10 2x20","e"],
  ["Fél egylábas guggolás","½ one-leg squat","1x5 2x10 2x20","e"],
  ["Egylábas guggolás támasszal","Assisted one-leg squat","1x5 2x10 2x20","e"],
  ["Egylábas guggolás","One-leg squat","1x5 2x10 2x50","e"]],
 pull: [
  ["Függőleges húzás","Vertical pull","1x10 2x20 3x40"],
  ["Vízszintes húzás","Horizontal pull","1x10 2x20 3x30"],
  ["Bicska húzódzkodás","Jackknife pull-up","1x10 2x15 3x20"],
  ["Fél húzódzkodás","Half pull-up","1x8 2x11 2x15"],
  ["Teljes húzódzkodás","Full pull-up","1x5 2x8 2x10"],
  ["Szűk húzódzkodás","Close pull-up","1x5 2x8 2x10"],
  ["Felemás húzódzkodás","Uneven pull-up","1x5 2x7 2x9","e"],
  ["Fél egykezes húzódzkodás","½ one-arm pull-up","1x4 2x6 2x8","e"],
  ["Egykezes húzódzkodás törülközővel","Assisted one-arm pull-up","1x3 2x5 2x7","e"],
  ["Egykezes húzódzkodás","One-arm pull-up","1x1 2x3 2x6","e"]],
 leg: [
  ["Térdhúzás","Knee tuck","1x10 2x25 3x40"],
  ["Térdemelés fekvésben","Flat knee raise","1x10 2x20 3x35"],
  ["Hajlított lábemelés fekvésben","Flat bent-leg raise","1x10 2x15 3x30"],
  ["Béka lábemelés fekvésben","Flat frog raise","1x8 2x15 3x25"],
  ["Nyújtott lábemelés fekvésben","Flat straight-leg raise","1x5 2x10 2x20"],
  ["Térdemelés függeszkedésben","Hanging knee raise","1x5 2x10 2x15"],
  ["Hajlított lábemelés függeszkedésben","Hanging bent-leg raise","1x5 2x10 2x15"],
  ["Béka lábemelés függeszkedésben","Hanging frog raise","1x5 2x10 2x15"],
  ["Fél nyújtott lábemelés","Partial straight-leg raise","1x5 2x10 2x15"],
  ["Nyújtott lábemelés függeszkedésben","Hanging straight-leg raise","1x5 2x10 2x30"]],
 bridge: [
  ["Rövid híd","Short bridge","1x10 2x25 3x50"],
  ["Egyenes híd","Straight bridge","1x10 2x20 3x40"],
  ["Híd szögben","Angled bridge","1x8 2x15 3x30"],
  ["Híd fejtámasszal","Head bridge","1x8 2x15 2x25"],
  ["Fél híd","Half bridge","1x8 2x15 2x20"],
  ["Teljes híd","Full bridge","1x6 2x10 2x15"],
  ["Híd a falon lefelé","Wall walking (down)","1x3 2x6 2x10"],
  ["Híd a falon felfelé","Wall walking (up)","1x2 2x4 2x8"],
  ["Híd állásból (lefelé)","Closing bridge","1x1 2x3 2x6"],
  ["Híd állásból állásba","Stand-to-stand bridge","1x1 2x3 2x10"]],
 hspu: [
  ["Fejenállás fal mellett","Wall headstand","1x30 1x60 1x120","s"],
  ["Varjútartás","Crow stand","1x10 1x30 1x60","s"],
  ["Kézenállás fal mellett","Wall handstand","1x30 1x60 1x120","s"],
  ["Fél fekvőtámasz kézenállásban","Half handstand push-up","1x5 2x10 2x20"],
  ["Fekvőtámasz kézenállásban","Handstand push-up","1x5 2x10 2x15"],
  ["Szűk fekvőtámasz kézenállásban","Close handstand push-up","1x5 2x9 2x12"],
  ["Felemás fekvőtámasz kézenállásban","Uneven handstand push-up","1x5 2x8 2x10","e"],
  ["Fél egykezes fekvőtámasz kézenállásban","½ one-arm handstand push-up","1x4 2x6 2x8","e"],
  ["Emelőkaros fekvőtámasz kézenállásban","Lever handstand push-up","1x3 2x4 2x6","e"],
  ["Egykezes fekvőtámasz kézenállásban","One-arm handstand push-up","1x1 2x2 1x5","e"]]
};
const step = (mv, n) => {
  const [hu, en, g, f=""] = STEPS[mv][n-1];
  return { hu, en, goals: g.split(" ").map(x => x.split("x").map(Number)), sec: f.includes("s"), side: f.includes("e") };
};

/* Programs from the book. Days: 0=Sun … 6=Sat. minSets = work sets the program asks for at minimum. */
const PROGRAMS = {
  fresh:    { days:{1:["push","leg"],5:["pull","squat"]}, sets:"2–3", minSets:1 },
  good:     { days:{1:["push","leg"],3:["pull","squat"],5:["hspu","bridge"]}, sets:"2", minSets:1 },
  veteran:  { days:{1:["pull"],2:["bridge"],3:["hspu"],4:["leg"],5:["squat"],6:["push"]}, sets:"2–3", minSets:1 },
  solitary: { days:{1:["pull","squat"],2:["push","leg"],3:["hspu","bridge"],4:["pull","squat"],5:["push","leg"],6:["hspu","bridge"]}, sets:"3–5", minSets:3 },
  supermax: { days:{1:["pull","squat"],2:["push","leg"],3:["hspu","bridge"],4:["pull","squat"],5:["push","leg"],6:["hspu","bridge"]}, sets:"10–50 × 10", minSets:10 }
};

/* ============ i18n ============ */
const T = {
 hu: {
  tabs:["Főoldal","Fejlődés","Edzés","Profil"], bodyWeight:"Testsúly", legDone:"Edzettél", legMiss:"Kimaradt", legPlan:"Tervezett",
  mv:{push:"Fekvőtámasz",squat:"Guggolás",pull:"Húzódzkodás",leg:"Lábemelés",bridge:"Híd",hspu:"Kézenállás"},
  mvLong:{hspu:"Fekvőtámasz kézenállásban"},

/* ============ State ============ */
const $ = s => document.querySelector(s);
const KEY = "fegyenc.v1";
const fresh = () => ({ lang: "en", program:"fresh",
  steps:{push:1,squat:1,pull:1,leg:1,bridge:1,hspu:1}, sessions:[], body:[] });
let db;
try { db = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch { db = fresh(); }
if (!db.since) { db.since = db.sessions.length ? Math.min(...db.sessions.map(s => s.date)) : Date.now(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
const t = () => T[db.lang];
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayKey = d => { const x = new Date(d); return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); };
const sName = (mv,n) => step(mv,n)[db.lang];
const mvName = (mv,long) => (long && t().mvLong[mv]) || t().mv[mv];
const fmtGoal = (st, g) => st.sec ? `${g[1]} ${t().secs}` : `${g[0]}×${g[1]}`;
const fmtVal = (st, v) => st.sec ? `${v} ${t().secs}` : `${v}`;

/* tiers met: work = array of reps/seconds at that step */
function tiersMet(st, work){
  return st.goals.map(([s,r]) => work.filter(x => x >= r).length >= s);
}
function history(mv, n){ // all work arrays at mv/step n, oldest first
  const out = [];
  db.sessions.forEach(s => s.items.forEach(it => { if (it.mv === mv && it.step === n && it.work.length) out.push({date:s.date, work:it.work}); }));
  return out;
}
function bestTier(mv, n){
  const st = step(mv,n); let best = -1;
  history(mv,n).forEach(h => tiersMet(st,h.work).forEach((m,i) => { if (m && i > best) best = i; }));
  return best;
}

function labelTabs(){
  document.documentElement.lang = db.lang;
  document.querySelectorAll("nav button").forEach((b,i) => { b.setAttribute("aria-label", t().tabs[i]); b.title = t().tabs[i]; });
}

/* ============ Today ============ */
function tierPills(mv){
  const n = db.steps[mv], st = step(mv,n), bt = bestTier(mv,n), cls = ["k","m","h"];
  return `<div class="tiers">${st.goals.map((g,i)=>`<span class="tier ${cls[i]} ${i<=bt?"met":""}">${t().tierShort[i]} ${fmtGoal(st,g)}</span>`).join("")}</div>`;
}
function mvCard(mv){
  const n = db.steps[mv];
  return `<div class="card"><div class="info"><div class="name">${esc(mvName(mv,true))}</div>
    <div class="meta">${t().stepOf(n)} · ${esc(sName(mv,n))}</div>${tierPills(mv)}</div>
    <button class="play" data-mv="${mv}" aria-label="${esc(mvName(mv))}">▶</button></div>`;
}
function renderToday(){
  const now = new Date(), P = PROGRAMS[db.program], today = P.days[now.getDay()] || [];
  $("#todayTitle").textContent = t().dayNames[now.getDay()].replace(/^./, c => c.toUpperCase());
  $("#todaySub").textContent = `${t().prog[db.program]} · ${now.toLocaleDateString(db.lang,{day:"numeric",month:"long"})}`;
  let html = "";
  if (today.length) html = today.map(mvCard).join("");
  else {
    let k = 1; while (k < 7 && !P.days[(now.getDay()+k)%7]) k++;
    const nd = (now.getDay()+k)%7;
    html = `<div class="rest"><b>${t().rest}</b><span class="meta">${t().next}: ${t().dayNames[nd]} – ${P.days[nd].map(m=>esc(mvName(m))).join(", ")}</span></div>`;
  }
  $("#todayList").innerHTML = html;
  document.querySelectorAll("#todayList .play").forEach(b => b.onclick = () => startWorkout([b.dataset.mv]));
  $("#todayBtns").innerHTML = today.length

    : `<button class="big" id="freeBtn">${t().free}</button>`;
  $("#freeBtn").onclick = pickFree;

function pickFree(){
  openSheet(`<h3>${t().pickMv}</h3>` + MV.map(m => `<button class="opt" data-a="${m}"><b>${esc(mvName(m,true))}</b> <span style="color:var(--mute)">· ${t().stepOf(db.steps[m])}</span></button>`).join(""),
    a => startWorkout([a]));
}

/* ============ Active workout ============ */
let W = null; // {mvs, mi, queue, items:[{mv,step,work,warm}], restStart}
function buildQueue(mv){
  const n = db.steps[mv], st = step(mv,n), q = [];
  const P = PROGRAMS[db.program];
  if (db.program !== "supermax") {
    // Warm-ups from earlier steps of the same series (book: ~20 then ~15 reps)
    const w = n >= 3 ? [n-2, n-1] : [n, n];
    w.forEach((wn, i) => {
      const ws = step(mv, wn), cap = ws.goals[2][1];
      const v = ws.sec ? Math.max(5, Math.round(ws.goals[0][1]/2)) : Math.min(i ? 15 : 20, cap);
      q.push({kind:"warm", step:wn, v, done:false});
    });
  }
  const hist = history(mv,n), last = hist.length ? hist[hist.length-1].work : [];
  const nextTier = Math.min(2, bestTier(mv,n)+1);
  const count = db.program === "supermax" ? 10 : Math.max(P.minSets, st.goals[nextTier][0]);
  for (let k = 0; k < count; k++) {
    const v = db.program === "supermax" ? Math.min(10, st.goals[2][1]) : (last[k] ?? last[last.length-1] ?? st.goals[0][1]);
    q.push({kind:"work", step:n, v, done:false});
  }
  return q;
}
function startWorkout(mvs){
  W = {mvs:[...mvs], mi:0, items:[], restStart:null};
  W.queue = buildQueue(mvs[0]);
  show("active"); renderActive();
}
const curItem = () => W.queue.find(x => !x.done);
const workStep = () => (W.queue.find(q => q.kind==="work") || {}).step || db.steps[W.mvs[W.mi]];
function renderActive(){
  const mv = W.mvs[W.mi], n = workStep(), st = step(mv,n), cur = curItem();
  const hist = history(mv,n), last = hist.length ? hist[hist.length-1].work : null;
  let wi = 0;
  const rows = W.queue.map(q => {
    const qs = step(mv, q.step);
    const label = q.kind === "warm" ? `${t().warm} · ${esc(sName(mv,q.step))}` : `${t().work} ${++wi}`;
    return `<li class="${q===cur?"cur":""} ${q.done?"done":""}">${label}<span>${q.skipped ? "—" : fmtVal(qs,q.v)}${q.done&&!q.skipped?" ✓":""}</span></li>`;
  }).join("");
  $("#activeTop").innerHTML = `
    <div class="mvname">${esc(mvName(mv,true))}${W.mvs.length>1?` · ${W.mi+1}/${W.mvs.length}`:""}</div>
    <h2 class="exname">${t().stepOf(n)}: ${esc(sName(mv,n))}</h2>
    <div class="goal">${t().goal}: ${st.goals.map((g,i)=>`${t().tiers[i]} ${fmtGoal(st,g)}`).join(" · ")}${st.side?` (${t().eachSide})`:""}</div>
    <ul class="queue">${rows}</ul>
    ${last ? `<p class="hint">${t().last}: ${last.map(v=>fmtVal(st,v)).join(", ")}</p>` : ""}
    ${st.sec ? "" : `<p class="hint">${t().tempo}</p>`}
    <p class="hint" id="restLine"></p>`;
  const cs = cur ? step(mv, cur.step) : st;
  $("#unitLbl").textContent = cs.sec ? t().secs : t().reps;
  $("#valOut").textContent = cur ? cur.v : "–";
  $("#endBtn").textContent = t().end;
  const lb = $("#logBtn"), mb = $("#minorBtn");
  lb.classList.toggle("warm", !!cur && cur.kind === "warm");
  if (!cur) {
    lb.textContent = W.mi < W.mvs.length-1 ? t().nextMv(mvName(W.mvs[W.mi+1])) : t().finish;
    mb.textContent = t().addSet; mb.style.display = "";
  } else if (cur.kind === "warm") {
    lb.textContent = t().doneWarm; mb.textContent = t().skip; mb.style.display = "";
  } else {
    lb.textContent = t().logSet(W.queue.filter(q=>q.kind==="work").indexOf(cur)+1);
    mb.style.display = "none";
  }
  tickRest();
}
function tickRest(){
  const el = $("#restLine"); if (!el || !W || !W.restStart) return;
  const s = Math.floor((Date.now()-W.restStart)/1000);
  el.innerHTML = `${t().restT}: <span class="timer">${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}</span>`;
}
setInterval(tickRest, 1000);
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
  const cur = curItem(); if (!cur) return;
  const sec = step(W.mvs[W.mi], cur.step).sec, d = sec ? 5 : 1;
  cur.v = Math.max(sec ? 5 : 0, cur.v + (b.dataset.s === "+" ? d : -d));
  buzz(8); $("#valOut").textContent = cur.v;
});
$("#logBtn").onclick = () => {
  const cur = curItem();
  if (!cur) { nextMovement(); return; }
  cur.done = true; W.restStart = Date.now();
  buzz(cur.kind === "work" ? 40 : 15);
  const lb = $("#logBtn"); lb.classList.remove("flash"); void lb.offsetWidth; lb.classList.add("flash");
  renderActive();
  if (!curItem()) evaluate();
};
$("#minorBtn").onclick = () => {
  const cur = curItem();
  if (cur && cur.kind === "warm") { cur.done = true; cur.skipped = true; renderActive(); return; }
  if (!cur) { // extra work set
    const works = W.queue.filter(q=>q.kind==="work");
    W.queue.push({kind:"work", step:workStep(), v: works.length ? works[works.length-1].v : 5, done:false});
    renderActive();
  }
};
function commitMovement(){
  const mv = W.mvs[W.mi];
  const work = W.queue.filter(q => q.kind==="work" && q.done).map(q => q.v);
  const warm = W.queue.filter(q => q.kind==="warm" && q.done && !q.skipped).length;
  const existing = W.items.find(i => i.mv === mv);
  if (existing) existing.work = work; else if (work.length) W.items.push({mv, step:workStep(), work, warm});
}
function evaluate(){
  const mv = W.mvs[W.mi], n = workStep(), st = step(mv,n);
  const work = W.queue.filter(q => q.kind==="work" && q.done).map(q => q.v);
  commitMovement();
  const met = tiersMet(st, work);
  if (met[2]) {
    buzz([60,40,60]);
    if (n === 10) { openSheet(`<h3>${t().master}</h3><button class="opt primary" data-a="ok">OK</button>`, ()=>{}); return; }
    openSheet(`<h3>${t().levelUp(n+1)}</h3><p class="sub">${esc(sName(mv,n+1))}</p>
      <button class="opt primary" data-a="up">${t().goUp}</button><button class="opt" data-a="stay">${t().stay}</button>`,
      a => { if (a === "up") { db.steps[mv] = n+1; save(); renderActive(); } });
  } else if (n > 1 && work.length && Math.max(...work) < st.goals[0][1] && !history(mv,n).length) {
    openSheet(`<h3>${t().stepBack}</h3>
      <button class="opt primary" data-a="back">${t().goBack} (${t().stepOf(n-1)})</button><button class="opt" data-a="stay">${t().stay}</button>`,
      a => { if (a === "back") { db.steps[mv] = n-1; save(); renderActive(); } });
  }
}
function nextMovement(){
  commitMovement();
  if (W.mi < W.mvs.length-1) { W.mi++; W.queue = buildQueue(W.mvs[W.mi]); W.restStart = null; renderActive(); buzz(10); return; }
  finishWorkout(true);
}
function finishWorkout(keep){
  if (keep) commitMovement();
  if (keep && W.items.length) { db.sessions.push({date:Date.now(), prog:db.program, items:W.items}); save(); }
  W = null; show("home"); renderHome();
}
$("#endBtn").onclick = () => {
  openSheet(`<h3>${t().endQ}</h3>
    <button class="opt primary" data-a="save">${t().saveEnd}</button>
    <button class="opt" data-a="discard" style="color:#e11d48">${t().discard}</button>
    <button class="opt" data-a="cancel">${t().keep}</button>`, a => {
    if (a === "save") finishWorkout(true); else if (a === "discard") finishWorkout(false);
  });
};

let pgMv = "push";
function renderProgress(){
  const n = db.steps[pgMv], st = step(pgMv,n);
  $("#pgName").textContent = mvName(pgMv,true);
  $("#pgStep").textContent = `${t().stepOf(n)} · ${sName(pgMv,n)}`;
  const pts = history(pgMv,n).map(h => ({x:h.date, y:Math.max(...h.work)}));
  $("#pgChart").innerHTML = `<div class="hint" style="margin:0 0 6px">${t().bestSet}</div>` + chart(pts, st);
}
const pgGo = d => { pgMv = MV[(MV.indexOf(pgMv) + d + MV.length) % MV.length]; buzz(8); renderProgress(); };
$("#pgPrev").onclick = () => pgGo(-1);
$("#pgNext").onclick = () => pgGo(1);
{ let x0 = null; const el = $("#s-progress");
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) pgGo(dx < 0 ? 1 : -1); }); }
function chart(pts, st){
  if (!pts.length) return `<div class="empty">${t().noData}</div>`;
  const W_=360, H=200, p=30, goals = st.goals.map(g=>g[1]);
  const ys = pts.map(q=>q.y).concat(goals), hi = Math.max(...ys)*1.1, lo = 0;
  const X = i => pts.length === 1 ? W_/2 : p + (W_-2*p)*i/(pts.length-1);
  const Y = v => H-p - (H-2*p)*(v-lo)/(hi-lo);
  const cols = ["var(--t1)","var(--t2)","var(--t3)"];
  const lines = goals.map((g,i)=>`<line x1="${p}" x2="${W_-p}" y1="${Y(g)}" y2="${Y(g)}" stroke="${cols[i]}" stroke-dasharray="4 4"/><text x="${W_-p+3}" y="${Y(g)+4}" font-size="11" fill="${cols[i]}">${t().tierShort[i]}</text>`).join("");
  const d = pts.map((q,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(q.y).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="chart">${lines}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
    ${pts.map((q,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="4" fill="var(--accent)"/>`).join("")}
    <text x="4" y="${Y(0)}" font-size="11" fill="var(--mute)">0</text></svg>`;
}

    const m = b.dataset.st; db.steps[m] = Math.min(10, Math.max(1, db.steps[m] + Number(b.dataset.d))); save(); buzz(8); renderProgram();
  });
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { db.lang = b.dataset.l; save(); labelTabs(); renderProgram(); });
  $("#exportBtn").onclick = exportData;
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#resetBtn").onclick = () => { if (confirm(t().resetQ)) { const l = db.lang; db = fresh(); db.lang = l; save(); renderProgram(); } };
}
function exportData(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
  a.download = "convict-conditioning-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => { try { const d = JSON.parse(txt); if (d.steps && d.sessions) { db = Object.assign(fresh(), d); save(); labelTabs(); renderProgram(); } } catch {} });
  e.target.value = "";
};

/* ============ Body ============ */
// Decimal sign the phone's keyboard produces (e.g. "," for Hungarian, "." for English)
const DEC = (1.5).toLocaleString(navigator.language || "en").replace(/\d/g, "")[0] || ".";
const fmtKg = v => v.toFixed(1).replace(".", DEC);
function renderWeightHistory(){
  // Latest weight is already the input's placeholder, so history shows only what it adds
  const kgs = db.body.map(b=>b.kg), st = (l,v)=>`<div class="stat"><small>${l}</small><b>${v}</b></div>`;
  const pts = db.body.map(b=>({x:b.date,y:b.kg}));
  $("#bwStats").style.display = $("#bwChart").style.display = pts.length < 2 ? "none" : "";
  if (pts.length < 2) return;
  const diff = kgs[kgs.length-1] - kgs[0];
  $("#bwStats").innerHTML = st(t().min, fmtKg(Math.min(...kgs))) + st(t().max, fmtKg(Math.max(...kgs))) + st(t().change, (diff > 0 ? "+" : diff < 0 ? "−" : "") + fmtKg(Math.abs(diff)));
  const W_=360,H=180,p=28, ys=pts.map(q=>q.y), lo=Math.min(...ys)-1, hi=Math.max(...ys)+1;
  const X=i=>p+(W_-2*p)*i/(pts.length-1), Y=v=>H-p-(H-2*p)*(v-lo)/(hi-lo);
  $("#bwChart").innerHTML = `<svg viewBox="0 0 ${W_} ${H}"><path d="${pts.map((q,i)=>(i?"L":"M")+X(i)+" "+Y(q.y)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <text x="${p}" y="14" font-size="12" fill="var(--mute)">${fmtKg(hi)}</text><text x="${p}" y="${H-6}" font-size="12" fill="var(--mute)">${fmtKg(lo)}</text></svg>`;
}
// Digits only, one decimal sign (either "." or "," typed, shown as DEC), max 3 + 1 digits
$("#bwIn").addEventListener("input", e => {
  let v = e.target.value.replace(/[.,]/g, DEC).replace(new RegExp(`[^0-9${DEC === "." ? "\\." : ","}]`, "g"), "");
  const i = v.indexOf(DEC);
  if (i >= 0) v = v.slice(0, i).slice(0, 3) + DEC + v.slice(i + 1).replaceAll(DEC, "").slice(0, 1);
  else v = v.slice(0, 3);
  e.target.value = v;
  $("#kgField").classList.remove("bad");
  $("#kgField").classList.toggle("has", v.length > 0);
});
function saveWeight(){
  const inp = $("#bwIn"), raw = inp.value || "";
  const kg = Math.round(parseFloat(raw.replace(",", ".")) * 10) / 10;
  if (!(kg >= 20 && kg <= 400)) {
    const f = $("#kgField"); f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad"); buzz([30,40,30]); inp.focus(); return;
  }
  const k = dayKey(Date.now());
  db.body = db.body.filter(b => dayKey(b.date) !== k);
  db.body.push({date:Date.now(), kg}); save(); buzz(40);
  inp.value = ""; inp.blur(); $("#kgField").classList.remove("has"); renderProgram();
}
$("#bwSave").onclick = e => { e.preventDefault(); saveWeight(); };

/* ============ Home ============ */
let calOff = 0; // months from the current one
function renderHome(){
  const now = new Date(), P = PROGRAMS[db.program];
  const first = new Date(now.getFullYear(), now.getMonth() + calOff, 1);
  const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const lead = (first.getDay()+6) % 7; // Monday first
  const done = new Set(db.sessions.map(s => dayKey(s.date)));
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const since = new Date(db.since); const since0 = new Date(since.getFullYear(), since.getMonth(), since.getDate()).getTime();
  let g = [1,2,3,4,5,6,0].map(d => `<div class="wd">${t().days[d]}</div>`).join("") + "<div></div>".repeat(lead);
  for (let d = 1; d <= days; d++) {
    const dt = new Date(first.getFullYear(), first.getMonth(), d), ts = dt.getTime(), k = dayKey(dt);
    const planned = !!P.days[dt.getDay()];
    const cls = done.has(k) ? "done" : planned && ts < today0 && ts >= since0 ? "miss" : planned && ts >= today0 ? "plan" : "";
    g += `<div class="cd ${cls} ${ts===today0?"today":""}">${d}</div>`;
  }
  const title = first.toLocaleDateString(db.lang, {month:"long", year:"numeric"});
  $("#cal").innerHTML = `<div class="calhead"><button id="calPrev" aria-label="‹">‹</button><b>${title.replace(/^./, c => c.toUpperCase())}</b><button id="calNext" aria-label="›">›</button></div>
    <div class="calgrid" style="grid-template-rows:auto repeat(${Math.ceil((lead+days)/7)},minmax(0,1fr))">${g}</div>
    <div class="legend"><span><i style="background:var(--cal-ok)"></i>${t().legDone}</span><span><i style="background:var(--cal-miss)"></i>${t().legMiss}</span><span><i style="box-shadow:inset 0 0 0 2px var(--accent)"></i>${t().legPlan}</span></div>`;
  $("#calPrev").onclick = () => { calOff--; renderHome(); };
  $("#calNext").onclick = () => { calOff++; renderHome(); };
  $("#bars").innerHTML = MV.map(m => {
    // 10-step "stoplight": steps already passed are filled, the rest are outlined
    const n = db.steps[m];
    return `<button class="bar" data-m="${m}" aria-label="${esc(mvName(m))} ${n}/10"><span>${esc(mvName(m))}</span><span class="segs">${Array.from({length:10},(_,i)=>`<i class="${i<n-1?"on":""}"></i>`).join("")}</span><small>${n}/10</small></button>`;
  }).join("");
  document.querySelectorAll("#bars .bar").forEach(b => b.onclick = () => { pgMv = b.dataset.m; buzz(8); show("progress"); renderProgress(); });
}
$("#bwIn").addEventListener("keydown", e => { if (e.key === "Enter") saveWeight(); });

labelTabs(); renderHome();
</script>
</body>
</html>
