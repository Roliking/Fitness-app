<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161a">
<title>Lift</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#14161a; --mute:#6b7280; --line:#e3e5ea;
  --accent:#ff5a1f; --accent-ink:#fff; --panel:#14161a; --panel-ink:#fff; --panel-2:#23262d;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d0e10; --card:#1a1c20; --ink:#f2f3f5; --mute:#9aa0aa; --line:#2a2d34; --panel:#1f2228; --panel-2:#2c3037; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.top{flex:1;min-height:0;overflow:auto;padding:20px 16px 16px}
.bottom{flex:none;padding:12px 16px 16px}
h1{font-size:28px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
.week{display:flex;gap:6px;margin-bottom:20px}
.day{flex:1;text-align:center;padding:8px 0;border-radius:12px;background:var(--card);font-size:12px;color:var(--mute)}
.day b{display:block;font-size:17px;color:var(--ink)}
.day.today{background:var(--accent);color:var(--accent-ink)} .day.today b{color:var(--accent-ink)}
.day.done::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:4px auto 0}
.day.today.done::after{background:#fff}
.card{display:flex;align-items:center;background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;gap:12px}
.card .info{flex:1;min-width:0}
.card .name{font-weight:700;font-size:18px}
.card .meta{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:26px;flex:none}
.big{min-height:64px;border-radius:18px;padding:0 24px;font-weight:700;font-size:18px;background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--card);color:var(--ink)}
.row-end{display:flex;justify-content:flex-end}
.row-split{display:flex;justify-content:space-between;align-items:center;gap:12px}
/* tabs */
nav{flex:none;display:flex;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;font-size:13px;color:var(--mute);font-weight:600}
nav button.on{color:var(--accent)}
nav.hide{display:none}
/* active workout */
.exname{font-size:30px;font-weight:800;margin:0}
.dots{display:flex;gap:6px;margin:10px 0 18px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)} .dots i.on{background:var(--accent)}
.sets{list-style:none;margin:0;padding:0}
.sets li{display:flex;justify-content:space-between;padding:12px 14px;background:var(--card);border-radius:12px;margin-bottom:8px;font-size:18px}
.sets li span{color:var(--mute)}
.hint{color:var(--mute);font-size:14px;margin-top:12px}
.panel{background:var(--panel);color:var(--panel-ink);border-radius:28px 28px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.steppers{display:grid;gap:10px;margin-bottom:14px}
.stepper{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:18px;padding:6px}
.stepper label{width:58px;padding-left:10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9aa0aa}
.stepper output{flex:1;text-align:center;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper button{width:64px;height:56px;border-radius:14px;background:#3a3f48;font-size:28px;font-weight:700;color:#fff}
.stepper button.plus{background:#4a505c}
.actions{display:flex;justify-content:space-between;align-items:center}
.end{height:56px;padding:0 18px;border-radius:14px;background:var(--panel-2);color:#ff8a8a;font-weight:700}
.log{height:72px;min-width:200px;border-radius:22px;background:var(--accent);color:#fff;font-size:21px;font-weight:800}
.log:active,.play:active,.big:active{transform:scale(.97)}
.flash{animation:flash .35s}
@keyframes flash{50%{background:#22c55e}}
/* progress/body */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:20px}
.chart{background:var(--card);border-radius:18px;padding:12px;margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block}
.empty{color:var(--mute);text-align:center;padding:40px 0}
select{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:0 14px;margin-bottom:10px}
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;height:48px;border-radius:12px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--accent);color:#fff}
.bw{display:flex;gap:10px;align-items:center}
.bw .stepper{flex:1;background:var(--card)} .bw .stepper button{background:var(--line);color:var(--ink)} .bw .stepper label{color:var(--mute)}
.bw .big{min-width:110px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.small{height:44px;padding:0 16px;border-radius:12px;background:var(--card);font-weight:600}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto}
.sheet button.opt{display:block;width:100%;text-align:left;height:56px;padding:0 14px;border-radius:14px;font-size:17px}
.sheet button.opt:active{background:var(--line)}
.sheet input{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-size:17px;margin:8px 0}
</style>
</head>
<body>
<div id="app">
  <!-- TODAY -->
  <section class="screen on" id="s-today">
    <div class="top">
      <h1 id="todayTitle"></h1>
      <p class="sub" id="todaySub"></p>
      <div class="week" id="week"></div>
      <div id="routines"></div>
    </div>
    <div class="bottom row-end"><button class="big" id="emptyBtn">Empty workout</button></div>
  </section>

  <!-- ACTIVE WORKOUT -->
  <section class="screen" id="s-active">
    <div class="top" id="activeTop"></div>
    <div class="panel">
      <div class="steppers">
        <div class="stepper"><label>kg</label><button data-s="w-" aria-label="Less weight">−</button><output id="wOut"></output><button class="plus" data-s="w+" aria-label="More weight">+</button></div>
        <div class="stepper"><label>reps</label><button data-s="r-" aria-label="Fewer reps">−</button><output id="rOut"></output><button class="plus" data-s="r+" aria-label="More reps">+</button></div>
      </div>
      <div class="actions">
        <button class="end" id="endBtn">End</button>
        <button class="log" id="logBtn"></button>
      </div>
    </div>
  </section>

  <!-- PROGRESS -->
  <section class="screen" id="s-progress">
    <div class="top">
      <h1 id="pgTitle">Progress</h1>
      <p class="sub" id="pgSub"></p>
      <div class="stats" id="pgStats"></div>
      <div class="chart" id="pgChart"></div>
    </div>
    <div class="bottom">
      <select id="pgEx" aria-label="Exercise"></select>
      <div class="seg" id="pgMetric">
        <button data-m="top">Top weight</button><button data-m="1rm">1RM</button><button data-m="vol">Volume</button>
      </div>
    </div>
  </section>

  <!-- BODY -->
  <section class="screen" id="s-body">
    <div class="top">
      <div class="topbar"><h1>Body</h1><button class="small" id="exportBtn">Export</button></div>
      <div class="stats" id="bwStats"></div>
      <div class="chart" id="bwChart"></div>
    </div>
    <div class="bottom">
      <div class="bw">
        <div class="stepper"><button data-b="-" aria-label="Lighter">−</button><output id="bwOut"></output><button data-b="+" aria-label="Heavier">+</button></div>
        <button class="big" id="bwSave">Save</button>
      </div>
    </div>
  </section>

  <nav id="nav">
    <button data-t="today" class="on">Today</button>
    <button data-t="progress">Progress</button>
    <button data-t="body">Body</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "lift.v1";
const DEFAULT = {
  routines: [
    {name:"Push", ex:["Bench Press","Overhead Press","Incline DB Press","Triceps Pushdown"]},
    {name:"Pull", ex:["Deadlift","Pull-up","Barbell Row","Biceps Curl"]},
    {name:"Legs", ex:["Squat","Romanian Deadlift","Leg Press","Calf Raise"]}
  ],
  sessions: [], body: []
};
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT); } catch { db = structuredClone(DEFAULT); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const dayKey = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const fmt = n => (Math.round(n*10)/10).toString();
const e1rm = (w,r) => w * (1 + r/30);

/* ---------- tabs ---------- */
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === "s-"+id));
  $("#nav").classList.toggle("hide", id === "active");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === id));
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { show(b.dataset.t); render(b.dataset.t); });
function render(t){ ({today:renderToday, progress:renderProgress, body:renderBody})[t](); }

/* ---------- today ---------- */
function lastSessionOf(name){
  for (let i = db.sessions.length-1; i >= 0; i--) if (db.sessions[i].name === name) return db.sessions[i];
}
function renderToday(){
  const now = new Date();
  $("#todayTitle").textContent = now.toLocaleDateString(undefined,{weekday:"long"});
  $("#todaySub").textContent = now.toLocaleDateString(undefined,{day:"numeric",month:"long"});
  const done = new Set(db.sessions.map(s => dayKey(s.date)));
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7));
  $("#week").innerHTML = Array.from({length:7},(_,i)=>{
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const k = dayKey(d);
    return `<div class="day ${k===dayKey(now)?"today":""} ${done.has(k)?"done":""}">${d.toLocaleDateString(undefined,{weekday:"short"}).slice(0,2)}<b>${d.getDate()}</b></div>`;
  }).join("");
  $("#routines").innerHTML = db.routines.map((r,i)=>{
    const last = lastSessionOf(r.name);
    const when = last ? "Last: "+new Date(last.date).toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "Not done yet";
    return `<div class="card"><div class="info"><div class="name">${esc(r.name)}</div><div class="meta">${esc(r.ex.join(" · "))}</div><div class="meta">${when}</div></div><button class="play" data-r="${i}" aria-label="Start ${esc(r.name)}">▶</button></div>`;
  }).join("");
  document.querySelectorAll(".play").forEach(b => b.onclick = () => startWorkout(db.routines[b.dataset.r].name, db.routines[b.dataset.r].ex));
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#emptyBtn").onclick = () => startWorkout("Workout", []);

/* ---------- active workout ---------- */
let cur = null; // {name, ex:[...], sets:[{ex,w,r,t}], i, w, r}
function startWorkout(name, ex){
  cur = {name, ex:[...ex], sets:[], i:0, w:20, r:8, start:Date.now()};
  show("active");
  if (!cur.ex.length) { pickExercise(); return; }
  loadDefaults(); renderActive();
}
const setsOf = ex => cur.sets.filter(s => s.ex === ex);
function prevSets(ex){
  for (let i = db.sessions.length-1; i >= 0; i--) {
    const s = db.sessions[i].sets.filter(x => x.ex === ex);
    if (s.length) return s;
  }
  return [];
}
// smart default: same set number from last session, else last set this session, else last session's final set
function loadDefaults(){
  const ex = cur.ex[cur.i]; if (!ex) return;
  const mine = setsOf(ex), prev = prevSets(ex);
  const src = prev[mine.length] || mine[mine.length-1] || prev[prev.length-1];
  if (src) { cur.w = src.w; cur.r = src.r; }
}
function renderActive(){
  const ex = cur.ex[cur.i];
  if (!ex) { $("#activeTop").innerHTML = `<h2 class="exname">No exercise</h2><p class="hint">Add one to start.</p><button class="big" id="addEx">+ Exercise</button>`; $("#addEx").onclick = pickExercise; $("#logBtn").textContent="Log set"; paint(); return; }
  const mine = setsOf(ex), prev = prevSets(ex);
  $("#activeTop").innerHTML =
    `<h2 class="exname">${esc(ex)}</h2>
     <div class="dots">${cur.ex.map((_,k)=>`<i class="${k===cur.i?"on":""}"></i>`).join("")}</div>
     <ul class="sets">${mine.map((s,k)=>`<li>Set ${k+1}<span>${fmt(s.w)} kg × ${s.r}</span></li>`).join("") || `<li><span>No sets yet</span></li>`}</ul>
     ${prev.length ? `<p class="hint">Last time: ${prev.map(s=>fmt(s.w)+"×"+s.r).join(", ")}</p>` : ""}
     <p class="hint">Swipe left/right to change exercise${cur.i===cur.ex.length-1 ? " · swipe left past the end to add one" : ""}</p>`;
  $("#logBtn").textContent = "Log set " + (mine.length+1);
  paint();
}
function paint(){ $("#wOut").textContent = fmt(cur.w); $("#rOut").textContent = cur.r; }
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
  const k = b.dataset.s;
  if (k==="w+") cur.w += 2.5; if (k==="w-") cur.w = Math.max(0, cur.w-2.5);
  if (k==="r+") cur.r += 1;   if (k==="r-") cur.r = Math.max(1, cur.r-1);
  buzz(8); paint();
});
$("#logBtn").onclick = () => {
  const ex = cur.ex[cur.i]; if (!ex) return;
  cur.sets.push({ex, w:cur.w, r:cur.r, t:Date.now()});
  buzz(40);
  $("#logBtn").classList.remove("flash"); void $("#logBtn").offsetWidth; $("#logBtn").classList.add("flash");
  loadDefaults(); renderActive();
};
function go(d){
  const n = cur.i + d;
  if (n >= cur.ex.length && d > 0) { pickExercise(); return; }
  if (n < 0 || n >= cur.ex.length) return;
  cur.i = n; loadDefaults(); renderActive(); buzz(10);
}
let sx = null;
const act = $("#s-active");
act.addEventListener("touchstart", e => { if (e.target.closest(".panel")) return; sx = e.touches[0].clientX; }, {passive:true});
act.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
});
$("#endBtn").onclick = () => {
  openSheet(`<h3 style="margin:4px 0 8px">End workout?</h3><p class="sub">${cur.sets.length} sets logged.</p>
    <button class="opt" data-a="save"><b>Finish &amp; save</b></button>
    <button class="opt" data-a="discard" style="color:#e11d48">Discard</button>
    <button class="opt" data-a="cancel">Keep going</button>`, a => {
    if (a === "save" && cur.sets.length) { db.sessions.push({date:Date.now(), name:cur.name, sets:cur.sets}); save(); }
    if (a !== "cancel") { cur = null; show("today"); renderToday(); }
  });
};

/* ---------- sheet ---------- */
function openSheet(html, onPick){
  $("#sheet").innerHTML = html; $("#sheetBg").classList.add("on");
  $("#sheet").onclick = e => { const b = e.target.closest("[data-a]"); if (!b) return; closeSheet(); onPick(b.dataset.a, b); };
}
function closeSheet(){ $("#sheetBg").classList.remove("on"); }
$("#sheetBg").onclick = e => { if (e.target.id === "sheetBg") closeSheet(); };
function knownExercises(){
  const s = new Set(); db.routines.forEach(r => r.ex.forEach(x => s.add(x))); db.sessions.forEach(x => x.sets.forEach(y => s.add(y.ex)));
  return [...s].sort();
}
function pickExercise(){
  const list = knownExercises().filter(x => !cur.ex.includes(x));
  openSheet(`<h3 style="margin:4px 0 8px">Add exercise</h3>
    <input id="newEx" placeholder="New exercise name…" autocomplete="off">
    <button class="opt" data-a="__new"><b>+ Add typed name</b></button>
    ${list.map(x => `<button class="opt" data-a="${esc(x)}">${esc(x)}</button>`).join("")}`, (a) => {
    const name = a === "__new" ? $("#newEx").value.trim() : a;
    if (!name) { if (!cur.ex.length) { cur = null; show("today"); } return; }
    cur.ex.push(name); cur.i = cur.ex.length-1; loadDefaults(); renderActive();
  });
}

/* ---------- charts ---------- */
function lineChart(pts, unit){
  if (pts.length < 2) return `<div class="empty">${pts.length ? fmt(pts[0].y)+" "+unit+" — log one more to see a trend" : "No data yet"}</div>`;
  const W=360,H=200,p=28, xs=pts.map(q=>q.x), ys=pts.map(q=>q.y);
  const x0=Math.min(...xs), x1=Math.max(...xs), lo=Math.min(...ys), hi=Math.max(...ys), pad=(hi-lo)||1;
  const y0=lo-pad*.15, y1=hi+pad*.15;
  const X = v => p + (W-2*p)*(v-x0)/((x1-x0)||1), Y = v => H-p - (H-2*p)*(v-y0)/(y1-y0);
  const d = pts.map((q,i)=>(i?"L":"M")+X(q.x).toFixed(1)+" "+Y(q.y).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(q=>`<circle cx="${X(q.x).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="4" fill="var(--accent)"/>`).join("")}
    <text x="${p}" y="16" fill="var(--mute)" font-size="12">${fmt(hi)} ${unit}</text>
    <text x="${p}" y="${H-6}" fill="var(--mute)" font-size="12">${fmt(lo)} ${unit}</text>
    <text x="${W-p}" y="${H-6}" fill="var(--mute)" font-size="12" text-anchor="end">${new Date(x1).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</text></svg>`;
}
const stat = (l,v) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`;

/* ---------- progress ---------- */
let pgEx = null, pgMetric = "top";
function renderProgress(){
  const exs = knownExercises().filter(x => db.sessions.some(s => s.sets.some(y => y.ex === x)));
  $("#pgEx").innerHTML = exs.length ? exs.map(x => `<option ${x===pgEx?"selected":""}>${esc(x)}</option>`).join("") : `<option>No data yet</option>`;
  if (!exs.length) { $("#pgSub").textContent = ""; $("#pgStats").innerHTML = ""; $("#pgChart").innerHTML = `<div class="empty">Finish a workout to see progress.</div>`; return; }
  if (!exs.includes(pgEx)) pgEx = exs[0];
  $("#pgEx").value = pgEx;
  document.querySelectorAll("#pgMetric button").forEach(b => b.classList.toggle("on", b.dataset.m === pgMetric));
  const pts = db.sessions.map(s => {
    const x = s.sets.filter(y => y.ex === pgEx); if (!x.length) return null;
    const v = {top: Math.max(...x.map(y=>y.w)), "1rm": Math.max(...x.map(y=>e1rm(y.w,y.r))), vol: x.reduce((a,y)=>a+y.w*y.r,0)}[pgMetric];
    return {x:s.date, y:v};
  }).filter(Boolean);
  const unit = pgMetric === "vol" ? "kg·reps" : "kg";
  $("#pgSub").textContent = pgEx;
  const best = Math.max(...pts.map(q=>q.y)), last = pts[pts.length-1].y;
  $("#pgStats").innerHTML = stat("Latest", fmt(last)) + stat("Best", fmt(best)) + stat("Sessions", pts.length);
  $("#pgChart").innerHTML = lineChart(pts, unit);
}
$("#pgEx").onchange = e => { pgEx = e.target.value; renderProgress(); };
document.querySelectorAll("#pgMetric button").forEach(b => b.onclick = () => { pgMetric = b.dataset.m; renderProgress(); });

/* ---------- body ---------- */
let bw = null;
function renderBody(){
  const last = db.body[db.body.length-1];
  if (bw === null) bw = last ? last.kg : 75;
  $("#bwOut").textContent = fmt(bw) + " kg";
  const kgs = db.body.map(b=>b.kg);
  $("#bwStats").innerHTML = last ? stat("Latest", fmt(last.kg)) + stat("Min", fmt(Math.min(...kgs))) + stat("Max", fmt(Math.max(...kgs))) : "";
  $("#bwChart").innerHTML = lineChart(db.body.map(b=>({x:b.date,y:b.kg})), "kg");
}
document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { bw = Math.max(20, bw + (b.dataset.b==="+" ? .1 : -.1)); bw = Math.round(bw*10)/10; buzz(8); $("#bwOut").textContent = fmt(bw)+" kg"; });
$("#bwSave").onclick = () => {
  const k = dayKey(Date.now());
  db.body = db.body.filter(b => dayKey(b.date) !== k);
  db.body.push({date:Date.now(), kg:bw}); save(); buzz(40); renderBody();
};
$("#exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
  a.download = "lift-export-"+dayKey(Date.now())+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

renderToday();
</script>
